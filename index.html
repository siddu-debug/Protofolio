<style>
/* ================= BASE (shared by every theme) ================= */

.bt:hover{transform:translate(-3px,-3px);box-shadow:var(--bsh,0 10px 30px rgba(0,0,0,.3));filter:brightness(1.08)}.bt.b2{background:transparent;color:var(--tx);border-color:var(--tx);box-shadow:none}.bt:disabled{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{font:600 12px var(--bf);letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--a);color:var(--a);border-radius:var(--cr,99px);background:transparent}
.chips span:nth-child(3n+2){color:var(--b);border-color:var(--b)}.chips span:nth-child(3n){color:var(--c);border-color:var(--c)}
.slot{position:relative;overflow:hidden;background:#0c0c0c}.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s,transform .9s;z-index:1}.slot img.ok{opacity:1}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font:700 11px var(--bf);letter-spacing:.16em;text-transform:uppercase;color:#fff;background:radial-gradient(circle at 25% 20%,color-mix(in srgb,var(--k,var(--a)) 55%,transparent),transparent 62%),radial-gradient(circle at 85% 90%,color-mix(in srgb,var(--b) 40%,transparent),transparent 55%),#101010}.ph>i{font-size:46px;color:var(--k,var(--a));filter:drop-shadow(0 0 16px var(--k,var(--a)))}
.ini{font:var(--hw) clamp(30px,6vw,70px) var(--hf);color:var(--a);text-shadow:0 0 22px var(--a);text-transform:none}
#pg{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));z-index:1000}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:8px;padding:12px 28px;background:var(--nb);border-bottom:var(--nbd);color:var(--nt,var(--tx));transition:.4s}
.na{width:42px;height:42px;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--a);flex:none}.na .ini{font-size:15px}

.lk a:hover{color:var(--nt,var(--tx));background:var(--lh)}.lk a.on{background:var(--lon,var(--lh));color:var(--lonc,var(--tx))}nav .bt{padding:10px 20px;font-size:13px}

.hero{min-height:100svh;display:flex;align-items:center;padding:130px 0 90px;position:relative;overflow:hidden}.hero .w{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}

.hi{display:inline-flex;align-items:center;gap:10px;font:600 13px var(--bf);letter-spacing:.16em;text-transform:uppercase;padding:8px 18px;border:1px solid var(--a);color:var(--a);margin-bottom:20px;border-radius:var(--hr,99px)}.hi i{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a);animation:pu 1.6s infinite}@keyframes pu{50%{opacity:.25}}
.hs{display:block;font:500 clamp(15px,2vw,22px) var(--bf);letter-spacing:.5em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}.nm{display:block;line-height:.98;position:relative}
.ty{font:600 clamp(18px,2.2vw,26px) var(--bf);color:var(--b);margin-top:18px;min-height:36px}.ty:after{content:"|";color:var(--a);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}

.mq{overflow:hidden;position:relative;z-index:3;padding:14px 0}.mq div{display:flex;gap:36px;width:max-content;animation:mq 30s linear infinite}.mq span{white-space:nowrap;display:flex;gap:36px;align-items:center;font:var(--hw) clamp(20px,3vw,34px) var(--hf);text-transform:uppercase;letter-spacing:.08em}.mq span:after{content:"✦";color:var(--b)}@keyframes mq{to{transform:translateX(-50%)}}
@keyframes rt{to{transform:rotate(360deg)}}
/* headings */
.sh{margin-bottom:50px;text-align:var(--al,left)}.sh small{display:inline-block;font:700 12px var(--bf);letter-spacing:.28em;text-transform:uppercase;color:var(--a);margin-bottom:14px}
h2{font-size:clamp(30px,5.2vw,66px);line-height:1.05}h2 em{font-style:normal;color:var(--a)}.sub{color:var(--mu);margin-top:12px;max-width:520px;margin-inline:var(--sm,0)}

.ab{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.ap{grid-column:span 4;grid-row:span 2;padding:0;overflow:hidden;display:flex;flex-direction:column}.ap .ps{flex:1;min-height:320px}.apt{padding:20px 24px}.apt p{color:var(--mu);font-size:15px}
.as,.at{grid-column:span 8}.as h3,.at h3{font-size:22px;margin-bottom:14px}.as p{color:var(--mu);margin-bottom:12px}.as p strong{color:var(--a);font-weight:600}.sn{grid-column:span 3;text-align:center}
.sn b{display:block;font:var(--hw) clamp(34px,4.4vw,58px)/1.1 var(--hf);color:var(--a)}.sn span{font:600 12px var(--bf);letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
/* skills */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.sk{overflow:hidden;padding:30px 26px;--sc:var(--a)}
.si{width:60px;height:60px;border-radius:var(--ir,16px);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:18px;border:1px solid var(--sc);color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent)}
.sk h3{font-size:21px;margin-bottom:8px}.sk p{font-size:15px;color:var(--mu)}.sk em{position:absolute;right:20px;top:10px;font:var(--hw) 46px var(--hf);font-style:normal;opacity:.12}
/* projects */
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px}.pc{padding:0;display:flex;flex-direction:column;overflow:hidden;--pcc:var(--a);--k:var(--pcc)}.pch{display:none;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);font:700 11px var(--bf);letter-spacing:.16em;color:var(--pcc)}.pch i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pcc);margin-right:6px}
.pc .slot{aspect-ratio:16/10;border-bottom:var(--bw) solid var(--bd)}.pc:hover .slot img{transform:scale(1.07)}.pc .b{padding:26px;display:flex;flex-direction:column;gap:12px;flex:1}
.pn{font:var(--hw) 44px/1 var(--hf);color:var(--pcc)}.pcat{font:600 12px var(--bf);letter-spacing:.18em;text-transform:uppercase;color:var(--pcc)}.pc h3{font-size:clamp(22px,2.4vw,30px);line-height:1.1}.pc p{color:var(--mu);font-size:15.5px;flex:1}
.pl{font:700 13px var(--bf);letter-spacing:.14em;text-transform:uppercase;color:var(--pcc);display:inline-flex;gap:10px;align-items:center;width:fit-content}.pl i{transition:.25s}.pc:hover .pl i{transform:translateX(7px)}
/* timeline + certs */
.tl{display:flex;flex-direction:column;gap:22px;max-width:920px;margin-inline:var(--sm,0)}.ti time{display:inline-block;font:700 12px var(--bf);letter-spacing:.2em;text-transform:uppercase;color:var(--a);margin-bottom:10px}
.ti h3{font-size:22px}.ti h4{font:600 15px var(--bf);color:var(--b);margin:4px 0 10px;text-transform:none;letter-spacing:.02em}.ti p{color:var(--mu);font-size:15.5px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}.cc{--cc:var(--a)}.cb{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:18px;color:var(--cc);border:1px solid var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.cc h4{font-size:18px;line-height:1.3;margin-bottom:6px}.cc p{font-size:14px;color:var(--mu);margin-bottom:16px}.cv{padding:10px 20px;font-size:12px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.3s}#md.on{opacity:1;pointer-events:auto}
.mb{background:var(--bg);color:var(--tx);border:var(--bw) solid var(--a);border-radius:var(--rd);max-width:700px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 0 60px color-mix(in srgb,var(--a) 35%,transparent)}.mh{padding:16px 24px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:12px;align-items:center}.mh h3{font-size:17px}.mh p{font-size:13px;color:var(--mu)}.mh button{width:40px;height:40px;border-radius:50%;border:1px solid var(--a);background:0;color:var(--a);cursor:pointer}.mbd{padding:20px}.mbd img{margin:auto;max-height:62vh;border-radius:8px}

.ctc{background:var(--cbg,none);color:var(--ctx,var(--tx))}.cbig{font:var(--hw) clamp(38px,8vw,110px)/1 var(--hf);text-transform:var(--tt);letter-spacing:var(--ls);text-align:var(--al,left)}.cbig em{font-style:normal;color:var(--a)}
.mail{display:inline-block;margin:24px 0 44px;font:600 clamp(18px,3vw,36px) var(--bf);color:var(--mc,var(--a));word-break:break-all;transition:.3s}.mail:hover{letter-spacing:.03em}.mw{text-align:var(--al,left)}
.cgr{display:grid;grid-template-columns:1fr 1.1fr;gap:22px}.det p{display:flex;gap:16px;align-items:center;margin-bottom:16px}.det p i{width:44px;height:44px;border:1px solid var(--a);color:var(--a);display:flex;align-items:center;justify-content:center;flex:none;border-radius:var(--ir,50%)}.det small{display:block;font:700 11px var(--bf);letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.soc{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.soc a{width:50px;height:50px;border:1px solid var(--a);color:var(--a);border-radius:var(--ir,50%);display:flex;align-items:center;justify-content:center;transition:.25s}.soc a:hover{background:var(--a);color:#000;transform:translateY(-5px)}
form{display:grid;gap:12px}input,textarea{width:100%;background:color-mix(in srgb,var(--tx) 7%,transparent);border:var(--bw) solid var(--bd);border-radius:calc(var(--rd)*.6);padding:14px 16px;color:var(--tx);font:500 16px var(--bf);outline:0;transition:.2s}input:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent)}textarea{resize:none}::placeholder{color:color-mix(in srgb,var(--tx) 40%,transparent)}
#fs{font-size:14px;min-height:20px;color:var(--a)}#fs.err{color:#ff7a8a}footer{padding:36px 20px;text-align:center;border-top:1px solid var(--bd);color:var(--mu);font-size:14px;position:relative;z-index:1}footer b{color:var(--a);font-weight:600}
/* theme switcher */
#ts{position:fixed;right:18px;bottom:18px;z-index:1500;font-family:system-ui,sans-serif}#tb{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:99px;border:0;cursor:pointer;color:#fff;font:600 14px system-ui;background:linear-gradient(#111,#111) padding-box,conic-gradient(from var(--r,0deg),#ff3cac,#2bf3ff,#cdfb4a,#ffb000,#ff3cac) border-box;border:2px solid transparent;box-shadow:0 10px 40px rgba(0,0,0,.5)}

#tp h5{font:600 11px system-ui;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);padding:6px 8px}#tp button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid transparent;background:0;color:#fff;cursor:pointer;font:500 15px system-ui;text-align:left;transition:.2s}#tp button:hover{background:rgba(255,255,255,.08)}#tp button.on{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12)}
#tp .sw{display:flex}#tp .sw i{width:16px;height:16px;border-radius:50%;margin-right:-5px;border:2px solid #111}#tp small{display:block;font-size:11px;color:rgba(255,255,255,.5)}#tip{position:absolute;right:0;bottom:62px;white-space:nowrap;background:#fff;color:#111;font:600 13px system-ui;padding:9px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fy 2s ease-in-out infinite}@keyframes fy{50%{transform:translateY(-6px)}}

/* ================= THEME 1 · KAWAII POP (pink pastel, cat-ear photo) ================= */
